<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Dungeon</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="misc/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap&family=Poppins:wght@500;600&family=Share+Tech&display=swap&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<style>
    .table-font{
        font-size: 100%;
    }
    
    @media screen and (max-width: 992px){
        .div-font{
            font-size: 80%;
            word-wrap: break-word;
        }
    }
    
    .loader{
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f7f9fb;
        transition: opacity 0.75s, visibility 0.75s;
    }
    
    .loader-hidden{
        opacity: 0;
        visibility: hidden;
    }
    
    .loader::after{
        content: "";
        width: 75px;
        height: 75px;
        border: 15px solid #dddddd;
        border-top-color: var(--fbc_color);
        border-radius: 50%;
        animation: loading 0.75s ease infinite;
    }
    
    @keyframes loading {
        from{
            transform: rotate(0turn);
        }
        to{
            transform: rotate(1turn);
        }
    }
</style>
<script>
    window.addEventListener("load", () => {
        const loader = document.querySelector(".loader");
        
        loader.classList.add("loader-hidden");
        document.getElementById('page').removeAttribute("class", "collapse");
        
        loader.addEventListener("transitionend", () => {
            document.body.removeChild("loader");
        })
    })
</script>
<body>
    <div id="page" class="collapse">
        <div id="header-placeholder"></div>
        <div class="container">
            <h1 class="text-center h-font" id="main-heading">Welcome to my Tabletop Games site!</h1>
            <p class="print-font"></p>
        </div>
        <script>
            fetch('misc/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                });
        </script>
    </div>
    <div class="loader"></div>
</body>
</html>
